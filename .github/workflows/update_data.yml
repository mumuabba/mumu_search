name: Daily Data Update

on:
  schedule:
    - cron: '0 16 * * *'  # 한국 시간 기준 매일 새벽 1시 (UTC 16:00)
  workflow_dispatch:      # 수동 실행 버튼 활성화

# 💡 [필수] 파일을 수정하고 저장소에 다시 올릴 수 있는 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리를 가져와야 rebase가 안정적으로 작동합니다.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Data Collector
        run: python update_script.py  # 👈 실행할 파이썬 파일명이 맞는지 꼭 확인하세요!

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경된 JSON 파일 스테이징
          git add pet_data_cache.json
          
          # 변경사항이 있을 때만 커밋 (없으면 통과)
          git commit -m "Update pet data [skip ci]" || echo "No changes to commit"
          
          # 💡 [핵심] 충돌 방지: 서버의 최신 상태를 가져와 내 작업 뒤에 붙임
          git pull --rebase origin main
          
          # 최종 푸시
          git push origin main
