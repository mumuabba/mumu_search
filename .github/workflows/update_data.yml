name: Daily MFDS Data Auto Update

on:
  schedule:
    # 매일 05:00 KST (= 20:00 UTC) 자동 실행
    - cron: '0 20 * * *'
  workflow_dispatch: # 관리자가 수동으로 즉시 실행할 수 있는 버튼 활성화

# 같은 파일을 커밋하므로 이전 실행과 겹쳐 돌지 않게 한다.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # 식약처 방화벽이 GitHub 러너 IP 일부를 응답 없이 차단한다(ConnectTimeout, 러너당 성공률 약 1/3).
  # 러너마다 IP가 다르므로 여러 대를 동시에 띄워 하나만 성공하면 그 결과를 쓴다.
  # 한 대 안에서 재시도하는 것은 IP가 그대로라 의미가 없다(실측으로 확인됨).
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements-data.txt

      - name: 엑셀 수집 시도
        id: fetch
        continue-on-error: true # 막힌 IP를 받는 건 정상이다. 한 대라도 뚫으면 된다.
        env:
          MUMU_RETRIES: '1' # 같은 IP 재시도는 무의미하므로 빨리 포기한다.
          MUMU_TIMEOUT: '45'
        run: python crawler.py

      - name: 성공한 결과만 업로드
        if: steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.attempt }}
          path: data.xlsx
          retention-days: 1

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements-data.txt

      - name: 수집 성공분 내려받기
        continue-on-error: true # 전부 실패하면 아티팩트가 없다. 아래에서 처리한다.
        uses: actions/download-artifact@v8
        with:
          path: incoming

      - name: 수집 성공 여부 확인
        run: |
          f=$(find incoming -name data.xlsx 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "::error::러너 6대 모두 식약처 접속 실패(ConnectTimeout). 데이터는 그대로 두고 다음 스케줄에 재시도합니다."
            exit 1
          fi
          echo "수집 성공. 사용할 파일: $f"
          cp "$f" data.xlsx

      - name: 통계 갱신 및 캐시 변환
        run: |
          python update_stats.py
          python convert_to_json.py

      - name: 갱신된 파일 깃허브에 자동 저장 (Commit & Push)
        run: |
          git config user.name "MumuAutoBot"
          git config user.email "autobot@mumu.search"
          git add data.xlsx stats.json pet_data_cache.json
          # 실제 변경이 있을 때만 커밋한다.
          git diff --staged --quiet || (git commit -m "로봇 자동 갱신: $(TZ=Asia/Seoul date +'%Y-%m-%d')" && git push)
